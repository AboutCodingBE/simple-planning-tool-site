<div class="main-panel">
  <div class="workerdayplanning">
    <div class="title">
      <h2>Dagplanning werkkrachten</h2>
    </div>
    <div class="date-picker">
      <label for="date">Datum</label>
      <input
        type="date"
        id="date"
        [value]="planningDate()"
        (change)="onDateChange($event)"
      />
    </div>
    <div class="overview">
      <table>
        <thead>
          <th>Voornaam</th>
          <th>Familienaam</th>
          <th>Werf</th>
          <th>Tot</th>
        </thead>
        <tbody>
          @for (detail of dayDetails(); track detail.id ) {
            <tr>
              <td>{{ detail.firstname }}</td>
              <td>{{ detail.lastname }}</td>
              <td>{{ detail.current_site?.name }}</td>
              <td>{{ detail.current_site?.until }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
